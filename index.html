<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나만의 행성 공방</title><link rel="stylesheet" href="style.css?v=3"></head><body><header><div class="top-bar"><div class="brand"><span>✦</span><div><h1>나만의 행성 공방</h1><small>우주에 하나뿐인 나의 세계</small></div></div><div class="actions"><button id="undo">↶ 되돌리기</button><button id="pause">▶ 저절로 돌기</button><button id="menu">☰ 도구</button></div></div><section class="save-toolbar" aria-label="작품 저장과 불러오기"><div class="toolbar-group"><span class="toolbar-label">작품 내려받기</span><div class="toolbar-buttons"><button id="png" class="primary">↓ PNG 저장</button><button id="gif" class="primary">↓ 회전 GIF</button><button id="video" class="primary">↓ 회전 영상</button></div></div><div class="toolbar-group"><span class="toolbar-label">이어서 만들기</span><div class="toolbar-buttons"><button id="export">작업 저장</button><button id="import">작업 불러오기</button></div></div><div class="toolbar-end"><button id="reset" class="new-planet">＋ 새 행성 만들기</button><span id="saveStatus" role="status">자동 기억 준비 중</span></div><input id="file" type="file" accept=".json,application/json" hidden></section></header><main><section id="stage"><canvas id="space"></canvas><canvas id="gl"></canvas><div class="stage-top"><span class="chip">PLANET STUDIO</span><input id="planetName" maxlength="30" aria-label="행성 이름" placeholder="내 행성에 이름을 붙여 주세요"></div><div class="stage-bottom"><span id="hint">행성을 칠해 보세요 · 바깥을 끌면 회전 · 두 손가락으로 확대</span><div><button id="zoomOut" aria-label="축소">−</button><button id="home">정면 보기</button><button id="zoomIn" aria-label="확대">＋</button></div></div><div id="error" hidden></div><div id="recording" hidden role="dialog" aria-modal="true" aria-label="회전 장면 저장"><div><strong id="recordTitle">회전 장면 만드는 중</strong><progress id="recordProgress" max="100" value="0"></progress><span id="recordInfo">창을 그대로 열어 두세요</span><button id="cancelRecording">취소</button></div></div><div id="toast" role="status"></div></section><aside><nav id="tabs" aria-label="꾸미기 도구"></nav><div id="panel"></div></aside></main><script src="app.js?v=3"></script></body></html>
